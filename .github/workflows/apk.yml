name: Build APK

on:
  push:
    branches: [main, fase-1-mvp, 'claude/**', 'ccr-*']
    paths-ignore: ['docs/**', 'supabase/**', 'site/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # Um build normal leva ~15-20 min; o padrão do GitHub (6h) deixaria um build travado ocupando a fila.
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_YOUVERSION_APP_KEY: ${{ secrets.EXPO_PUBLIC_YOUVERSION_APP_KEY }}
      # Número deste build, embutido no app para o aviso de atualização (ver features/updates).
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check secrets
        run: |
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_YOUVERSION_APP_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v não configurado"; exit 1; fi
          done

      # Um secret com aspas, espaço, quebra de linha ou barra final faz o app fechar ao abrir.
      # Só imprime o tamanho, nunca o valor.
      - name: Validate secret formats
        run: |
          ok=1
          bad() { echo "::error::$1 com formato inválido (tamanho ${#2}): sem aspas, espaços, quebras de linha"; ok=0; }
          url="$EXPO_PUBLIC_SUPABASE_URL"
          key="$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          yv="$EXPO_PUBLIC_YOUVERSION_APP_KEY"
          [[ "$url" =~ ^https://[^[:space:]\"\'/]+$ ]] || bad "EXPO_PUBLIC_SUPABASE_URL (esperado https://xxxx.supabase.co, sem barra no final)" "$url"
          [[ "$key" =~ ^[A-Za-z0-9_.-]+$ ]] || bad "EXPO_PUBLIC_SUPABASE_ANON_KEY" "$key"
          [[ "$yv" =~ ^[A-Za-z0-9_.-]+$ ]] || bad "EXPO_PUBLIC_YOUVERSION_APP_KEY" "$yv"
          if [ "$ok" = 1 ]; then echo "Formatos dos secrets OK (url=${#url}, anon=${#key}, yv=${#yv} caracteres)"; else exit 1; fi

      - run: npm ci --legacy-peer-deps
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint

      # ios/ e android/ não existem no repo (CNG): são gerados a cada build.
      - run: npx expo prebuild --platform android --no-install

      # O secret ANDROID_DEBUG_KEYSTORE_BASE64 mantém a assinatura igual em todo build, para o APK
      # poder ser instalado por cima da versão anterior (e o aviso de atualização do app funcionar).
      - name: Use fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 não configurado: sem ele a assinatura muda a cada build e o app não atualiza por cima."
            exit 1
          fi
          # Colar pelo celular costuma deixar espaços, quebras de linha ou aspas: remove antes de decodificar.
          cleaned=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]"'"'")
          if ! printf '%s' "$cleaned" | base64 -d > android/app/debug.keystore 2>/dev/null; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 não é base64 válido (${#cleaned} caracteres depois de limpar). Copie o texto inteiro gerado por 'base64 -w0 debug.keystore' (uma linha só, sem aspas)."
            exit 1
          fi
          echo "Keystore decodificado: $(wc -c < android/app/debug.keystore) bytes"
          if ! keytool -list -keystore android/app/debug.keystore -storepass android 2>/dev/null | grep -q androiddebugkey; then
            echo "::error::O keystore não abre com a senha 'android' ou não tem o alias 'androiddebugkey'. Gere de novo com os comandos do README/da conversa."
            exit 1
          fi
          echo "Keystore OK (alias androiddebugkey)"

      - name: Set versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          # Se o template do Expo mudar e o sed não casar, o APK novo não atualizaria por cima do antigo.
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      # Só arm64-v8a (todo celular Android atual): o APK com as 4 arquiteturas passava de 130 MB.
      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Impressão digital (pública) do certificado: iguais entre builds = o Android aceita atualizar por cima.
      - name: Show signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Lumi-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Release fixa "apk-latest": abra a página no celular e baixe o APK.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Lumi.apk
          # A API do GitHub às vezes responde 500 ao apagar/criar release; tenta de novo antes de falhar.
          for attempt in 1 2 3 4; do
            gh release delete apk-latest --cleanup-tag --yes || true
            if gh release create apk-latest Lumi.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Lumi (APK mais recente)" \
              --notes "Build #${{ github.run_number }} do commit $GITHUB_SHA"; then
              exit 0
            fi
            echo "Tentativa $attempt de publicar a release falhou; aguardando para repetir."
            sleep $((attempt * 15))
          done
          echo "::error::Não foi possível publicar a release apk-latest"
          exit 1
